name: Build Android 16 Custom AOD APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor Dependencies & Add Android
        run: |
          npm install
          npx cap add android

      - name: Ensure Web Assets (www/index.html) Exist
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <title>Custom AOD Clock</title>
            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                user-select: none;
              }
              html, body {
                width: 100%;
                height: 100%;
                background-color: #000000;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
              }
              #aod-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                transition: opacity 0.6s ease, transform 1s ease;
              }
              #aod-container.sleep {
                opacity: 0;
                pointer-events: none;
              }
              canvas {
                display: block;
              }
              .digital-time {
                margin-top: 18px;
                font-size: 64px;
                font-weight: 500;
                letter-spacing: 2px;
                color: #ff8c24;
                text-shadow: 0 0 18px rgba(255, 140, 36, 0.35);
                line-height: 1;
              }
              .meta-info {
                margin-top: 10px;
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 1.5px;
                color: #d4d4d4;
                text-transform: uppercase;
              }
              #setup-panel {
                position: fixed;
                bottom: 24px;
                display: flex;
                gap: 10px;
                z-index: 10;
              }
              button {
                background: #1a1a1a;
                color: #ff8c24;
                border: 1px solid #333;
                padding: 10px 16px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 600;
              }
              button:active {
                background: #2c2c2c;
              }
            </style>
          </head>
          <body>
            <div id="aod-container">
              <canvas id="analogClock" width="260" height="260"></canvas>
              <div class="digital-time" id="digitalTime">05:32</div>
              <div class="meta-info" id="metaInfo">WED, OCT 28 &nbsp; 91%</div>
            </div>
            <div id="setup-panel">
              <button onclick="wakeAOD()">Test 30s Timer</button>
              <button onclick="requestOverlay()">Enable Auto AOD</button>
            </div>
            <script>
              const canvas = document.getElementById("analogClock");
              const ctx = canvas.getContext("2d");
              const radius = canvas.height / 2;
              ctx.translate(radius, radius);

              const aodContainer = document.getElementById("aod-container");
              const setupPanel = document.getElementById("setup-panel");
              let sleepTimeout = null;
              let batteryLevel = "95%";

              if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                  const updateBat = () => {
                    batteryLevel = Math.round(battery.level * 100) + "%";
                  };
                  updateBat();
                  battery.addEventListener("levelchange", updateBat);
                });
              }

              function drawClock() {
                ctx.clearRect(-radius, -radius, canvas.width, canvas.height);
                const now = new Date();

                for (let num = 1; num <= 12; num++) {
                  const ang = (num * Math.PI) / 6;
                  ctx.save();
                  ctx.rotate(ang);

                  ctx.beginPath();
                  ctx.moveTo(0, -radius * 0.92);
                  ctx.lineTo(0, -radius * 0.85);
                  ctx.strokeStyle = "#888888";
                  ctx.lineWidth = 1.5;
                  ctx.stroke();

                  ctx.translate(0, -radius * 0.72);
                  ctx.rotate(-ang);
                  ctx.font = "400 16px sans-serif";
                  ctx.fillStyle = "#e6e6e6";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText(num.toString(), 0, 0);
                  ctx.restore();
                }

                let hour = now.getHours();
                let minute = now.getMinutes();
                let second = now.getSeconds();

                const displayHour = String(hour % 12 || 12).padStart(2, "0");
                const displayMin = String(minute).padStart(2, "0");
                document.getElementById("digitalTime").textContent = `${displayHour}:${displayMin}`;

                const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
                const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                const dateStr = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
                document.getElementById("metaInfo").innerHTML = `${dateStr} &nbsp; ${batteryLevel}`;

                hour = hour % 12;
                const hourAngle = (hour * Math.PI) / 6 + (minute * Math.PI) / (6 * 60);
                drawHand(hourAngle, radius * 0.45, 5, "#ffffff", true);

                const minuteAngle = (minute * Math.PI) / 30 + (second * Math.PI) / (30 * 60);
                drawHand(minuteAngle, radius * 0.68, 4, "#ffffff", false);

                const secondAngle = (second * Math.PI) / 30;
                drawSecondHand(secondAngle, radius * 0.75);

                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, 2 * Math.PI);
                ctx.fillStyle = "#ff8c24";
                ctx.fill();
              }

              function drawHand(pos, length, width, color, hollow) {
                ctx.save();
                ctx.beginPath();
                ctx.lineWidth = width;
                ctx.lineCap = "round";
                ctx.rotate(pos);
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -length);
                ctx.strokeStyle = color;
                ctx.stroke();

                if (hollow) {
                  ctx.beginPath();
                  ctx.lineWidth = width - 2.5;
                  ctx.moveTo(0, -8);
                  ctx.lineTo(0, -length + 4);
                  ctx.strokeStyle = "#000000";
                  ctx.stroke();
                }
                ctx.restore();
              }

              function drawSecondHand(pos, length) {
                ctx.save();
                ctx.beginPath();
                ctx.lineWidth = 1.5;
                ctx.lineCap = "round";
                ctx.rotate(pos);
                ctx.moveTo(0, 16);
                ctx.lineTo(0, -length);
                ctx.strokeStyle = "#ff8c24";
                ctx.stroke();
                ctx.restore();
              }

              function wakeAOD() {
                aodContainer.classList.remove("sleep");
                const shiftX = Math.floor(Math.random() * 14) - 7;
                const shiftY = Math.floor(Math.random() * 20) - 10;
                aodContainer.style.transform = `translate(${shiftX}px, ${shiftY}px)`;

                if (sleepTimeout) clearTimeout(sleepTimeout);
                sleepTimeout = setTimeout(() => {
                  aodContainer.classList.add("sleep");
                  if (window.AndroidBridge && window.AndroidBridge.finishAOD) {
                    window.AndroidBridge.finishAOD();
                  }
                }, 30000);
              }

              function requestOverlay() {
                if (window.AndroidBridge && window.AndroidBridge.openOverlaySettings) {
                  window.AndroidBridge.openOverlaySettings();
                } else {
                  alert("APK ইনস্টল করার পর এই বাটন থেকে Overlay ও Service পারমিশন চালু করতে পারবেন।");
                }
              }

              if (window.location.search.includes("aod=1")) {
                setupPanel.style.display = "none";
              }

              document.body.addEventListener("click", (e) => {
                if (e.target.tagName !== "BUTTON") {
                  wakeAOD();
                }
              });

              setInterval(drawClock, 1000);
              drawClock();
              wakeAOD();
            </script>
          </body>
          </html>
          EOF
          fi

      - name: Inject Native AOD Code & Android 16 Permissions
        run: |
          PKG_DIR="android/app/src/main/java/com/mehedi/customaod"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/AodService.java"
          package com.mehedi.customaod;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          public class AodService extends Service {
              private static final String CHANNEL_ID = "CustomAodChannel";
              private BroadcastReceiver screenOffReceiver;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();

                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("Custom AOD Active")
                          .setContentText("30s Analog+Digital Clock ready on screen off")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .build();

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(101, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(101, notification);
                  }

                  screenOffReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (Intent.ACTION_SCREEN_OFF.equals(intent.getAction())) {
                              Intent aodIntent = new Intent(context, MainActivity.class);
                              aodIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                              aodIntent.putExtra("FROM_SCREEN_OFF", true);
                              context.startActivity(aodIntent);
                          }
                      }
                  };

                  IntentFilter filter = new IntentFilter(Intent.ACTION_SCREEN_OFF);
                  registerReceiver(screenOffReceiver, filter);
              }

              private void createNotificationChannel() {
                  NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Custom AOD Service",
                          NotificationManager.IMPORTANCE_LOW
                  );
                  NotificationManager manager = getSystemService(NotificationManager.class);
                  if (manager != null) {
                      manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  if (screenOffReceiver != null) {
                      unregisterReceiver(screenOffReceiver);
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.mehedi.customaod;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  hideSystemUI();

                  Intent serviceIntent = new Intent(this, AodService.class);
                  startForegroundService(serviceIntent);

                  this.bridge.getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void finishAOD() {
                          runOnUiThread(() -> {
                              getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              moveTaskToBack(true);
                          });
                      }

                      @JavascriptInterface
                      public void openOverlaySettings() {
                          if (!Settings.canDrawOverlays(MainActivity.this)) {
                              Intent intent = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())
                              );
                              startActivity(intent);
                          }
                      }
                  }, "AndroidBridge");
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  hideSystemUI();
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().evaluateJavascript("wakeAOD();", null);
                  }
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  );
              }
          }
          EOF

          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application|' "$MANIFEST"
          sed -i 's|</application>|    <service android:name=".AodService" android:exported="false" android:foregroundServiceType="specialUse" />\n    </application>|' "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-AOD-Clock-Android16
          path: android/app/build/outputs/apk/debug/app-debug.apk
