<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Custom AOD Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #aod-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, transform 1s ease;
    }
    #aod-container.sleep {
      opacity: 0;
      pointer-events: none;
    }
    canvas {
      display: block;
    }
    .digital-time {
      margin-top: 18px;
      font-size: 64px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #ff8c24;
      text-shadow: 0 0 18px rgba(255, 140, 36, 0.35);
      line-height: 1;
    }
    .meta-info {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #d4d4d4;
      text-transform: uppercase;
    }
    #setup-panel {
      position: fixed;
      bottom: 24px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    button {
      background: #1a1a1a;
      color: #ff8c24;
      border: 1px solid #333;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    button:active {
      background: #2c2c2c;
    }
  </style>
</head>
<body>

  <div id="aod-container">
    <canvas id="analogClock" width="260" height="260"></canvas>
    <div class="digital-time" id="digitalTime">05:32</div>
    <div class="meta-info" id="metaInfo">WED, OCT 28 &nbsp; 91%</div>
  </div>

  <div id="setup-panel">
    <button onclick="wakeAOD()">Test 30s Timer</button>
    <button onclick="requestOverlay()">Enable Auto AOD</button>
  </div>

  <script>
    const canvas = document.getElementById("analogClock");
    const ctx = canvas.getContext("2d");
    const radius = canvas.height / 2;
    ctx.translate(radius, radius);

    const aodContainer = document.getElementById("aod-container");
    const setupPanel = document.getElementById("setup-panel");
    let sleepTimeout = null;
    let batteryLevel = "95%";

    if (navigator.getBattery) {
      navigator.getBattery().then(battery => {
        const updateBat = () => {
          batteryLevel = Math.round(battery.level * 100) + "%";
        };
        updateBat();
        battery.addEventListener("levelchange", updateBat);
      });
    }

    function drawClock() {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);
      const now = new Date();

      for (let num = 1; num <= 12; num++) {
        const ang = (num * Math.PI) / 6;
        ctx.save();
        ctx.rotate(ang);

        ctx.beginPath();
        ctx.moveTo(0, -radius * 0.92);
        ctx.lineTo(0, -radius * 0.85);
        ctx.strokeStyle = "#888888";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.translate(0, -radius * 0.72);
        ctx.rotate(-ang);
        ctx.font = "400 16px sans-serif";
        ctx.fillStyle = "#e6e6e6";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(num.toString(), 0, 0);
        ctx.restore();
      }

      let hour = now.getHours();
      let minute = now.getMinutes();
      let second = now.getSeconds();

      const displayHour = String(hour % 12 || 12).padStart(2, "0");
      const displayMin = String(minute).padStart(2, "0");
      document.getElementById("digitalTime").textContent = `${displayHour}:${displayMin}`;

      const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      const dateStr = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
      document.getElementById("metaInfo").innerHTML = `${dateStr} &nbsp; ${batteryLevel}`;

      hour = hour % 12;
      const hourAngle = (hour * Math.PI) / 6 + (minute * Math.PI) / (6 * 60);
      drawHand(hourAngle, radius * 0.45, 5, "#ffffff", true);

      const minuteAngle = (minute * Math.PI) / 30 + (second * Math.PI) / (30 * 60);
      drawHand(minuteAngle, radius * 0.68, 4, "#ffffff", false);

      const secondAngle = (second * Math.PI) / 30;
      drawSecondHand(secondAngle, radius * 0.75);

      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, 2 * Math.PI);
      ctx.fillStyle = "#ff8c24";
      ctx.fill();
    }

    function drawHand(pos, length, width, color, hollow) {
      ctx.save();
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.rotate(pos);
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -length);
      ctx.strokeStyle = color;
      ctx.stroke();

      if (hollow) {
        ctx.beginPath();
        ctx.lineWidth = width - 2.5;
        ctx.moveTo(0, -8);
        ctx.lineTo(0, -length + 4);
        ctx.strokeStyle = "#000000";
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawSecondHand(pos, length) {
      ctx.save();
      ctx.beginPath();
      ctx.lineWidth = 1.5;
      ctx.lineCap = "round";
      ctx.rotate(pos);
      ctx.moveTo(0, 16);
      ctx.lineTo(0, -length);
      ctx.strokeStyle = "#ff8c24";
      ctx.stroke();
      ctx.restore();
    }

    function wakeAOD() {
      aodContainer.classList.remove("sleep");
      const shiftX = Math.floor(Math.random() * 14) - 7;
      const shiftY = Math.floor(Math.random() * 20) - 10;
      aodContainer.style.transform = `translate(${shiftX}px, ${shiftY}px)`;

      if (sleepTimeout) clearTimeout(sleepTimeout);
      sleepTimeout = setTimeout(() => {
        aodContainer.classList.add("sleep");
        if (window.AndroidBridge && window.AndroidBridge.finishAOD) {
          window.AndroidBridge.finishAOD();
        }
      }, 30000);
    }

    function requestOverlay() {
      if (window.AndroidBridge && window.AndroidBridge.openOverlaySettings) {
        window.AndroidBridge.openOverlaySettings();
      } else {
        alert("APK ইনস্টল করার পর এই বাটন থেকে Overlay ও Service পারমিশন চালু করতে পারবেন।");
      }
    }

    if (window.location.search.includes("aod=1")) {
      setupPanel.style.display = "none";
    }

    document.body.addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") {
        wakeAOD();
      }
    });

    setInterval(drawClock, 1000);
    drawClock();
    wakeAOD();
  </script>
</body>
</html>
